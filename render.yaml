# Render Blueprint for the TANEXPO demo: one Node.js web service with a persistent disk.
# In Render: New > Blueprint > pick this repository (branch main).
# You are asked for the values marked "sync: false" when you create it.
services:
  - type: web
    name: tanexpo-demo
    runtime: node
    # --include=dev: NODE_ENV=production below also applies during the build, and plain `npm ci`
    # would then skip Vite/esbuild, which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.cjs
    plan: starter            # a persistent disk needs a paid instance; the free tier would wipe the database
    region: frankfurt        # closest Render region to East Africa
    numInstances: 1          # must stay 1: the embedded database is single-process
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: tanexpo-data
      mountPath: /var/data
      sizeGB: 5            # database plus operators' package photos and videos
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PG_DATA_DIR
        value: /var/data/pg     # photos/videos go next to it, in /var/data/media
      - key: PAYMENTS_MODE
        value: simulated
      - key: SEED_DEMO_CATALOG
        value: "true"
      - key: ALLOW_WHATSAPP_SIMULATOR
        value: "true"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: APP_URL
        sync: false            # the https://....onrender.com address, once you know it
      - key: GEMINI_API_KEY
        sync: false            # optional; leave empty to use the keyword parser
      - key: GEOAPIFY_API_KEY
        sync: false            # optional; Geoapify map tiles (free plan allows commercial use). Empty = OpenStreetMap tiles
